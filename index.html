.intro{font-size:13px;line-height:1.5;margin:12px 0 0;color:#664b62;font-weight:550}
.content{padding:23px 25px 25px;background:linear-gradient(#fff 0%,#fff 72%,#fffafd 100%)}
a{text-decoration:none}
.wa{display:flex;align-items:center;text-align:left;gap:12px;width:100%;padding:14px 15px;border-radius:16px;background:var(--green);color:white;box-shadow:0 8px 19px rgba(15,112,86,.18);transition:transform .15s,background .15s}
.wa:hover{background:#0e694d;transform:translateY(-1px)}.waicon{height:41px;width:41px;flex:0 0 41px;border-radius:12px;background:#ffffff20;display:grid;place-items:center}.waicon svg{height:23px;width:23px}.watitle{display:block;font-size:15px;font-weight:750;line-height:1.2}.wanumber{display:block;color:#d9f6e9;font-size:12px;margin-top:4px}.arrow{margin-left:auto;font-size:22px;line-height:1;color:inherit;opacity:.6}
.section{display:flex;align-items:center;gap:10px;margin:25px 0 13px;text-transform:uppercase;letter-spacing:1.2px;font-size:11px;font-weight:800;color:#a3547d}.section:before,.section:after{content:"";height:1px;flex:1;background:#f3d6e5}
nav{display:grid;gap:10px}.social{min-height:60px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid transparent;border-radius:16px;text-align:left;color:#4a3045;font-size:15px;font-weight:720;transition:transform .15s,filter .15s}.social:hover{transform:translateY(-1px);filter:saturate(1.2)}
.social.instagram{background:#ffe8f3;border-color:#ffc4dd}.social.tiktok{background:#efeaff;border-color:#daccff}.social.facebook{background:#e5f1ff;border-color:#c4e0ff}
.symbol{height:34px;width:34px;display:grid;place-items:center;flex:0 0 34px;border-radius:10px;background:#fff;color:#dc3f84}.symbol.tk{color:#2d2631}.symbol.fb{color:#1764d4}.symbol svg{height:20px;width:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:22px;font-size:12px;color:#9b7a91}.footer-spark{font-size:14px;color:#e85c9a;margin:0 4px}
a:focus-visible{outline:3px solid #843ede;outline-offset:3px}
@media(max-width:440px){body{padding:16px 12px 25px;place-items:start center}.card{border-radius:26px}.hero{padding:29px 19px 25px}.logo{width:164px;height:164px}h1{font-size:31px}.content{padding:21px 20px 23px}.wa{gap:11px}.watitle{font-size:14px}}
@media(prefers-reduced-motion:reduce){.wa,.social{transition:none}}
</style>
