<style>
:root{--c:#08a8e8;--m:#ef0a79;--y:#ffd400;--k:#111318;--g:#f3f5f7;}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff 0%,#f7f8fa 70%,#eef1f4 100%);font-family:Arial,Helvetica,sans-serif;color:var(--k);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:min(440px,100%);position:relative}.stripe{height:8px;border-radius:10px;background:linear-gradient(90deg,var(--c) 0 25%,var(--m) 25% 50%,var(--y) 50% 75%,var(--k) 75%);margin-bottom:22px}.card{background:#fff;border-radius:28px;padding:30px 22px 24px;box-shadow:0 18px 50px rgba(20,25,35,.12);border:1px solid #e7e9ed;text-align:center}.logo{display:block;width:min(330px,86%);height:auto;margin:0 auto 18px;object-fit:contain}.lead{margin:10px 4px 20px;font-size:22px;line-height:1.2;font-weight:850}.lead span{color:var(--m)}.hint{margin:0 8px 24px;color:#666b73;line-height:1.45;font-size:14px}.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;border-radius:18px;padding:17px 18px;margin:12px 0;font-size:17px;font-weight:850;box-shadow:0 8px 18px rgba(0,0,0,.11);transition:.15s transform}.btn:active{transform:scale(.985)}.ico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:21px;font-weight:900}.txt{text-align:left;flex:1}.txt small{display:block;font-size:11px;font-weight:600;opacity:.82;margin-top:3px}.ig{background:linear-gradient(120deg,#672ed0,#df1967,#fa7721)}.fb{background:#1769e0}.wa{background:#20b95a}.arrow{font-size:24px;opacity:.85}.foot{font-size:11px;color:#7a7f87;margin-top:20px}.mini{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--c) 0 25%,var(--m) 25% 50%,var(--y) 50% 75%,var(--k) 75%);margin-top:24px}
</style>
